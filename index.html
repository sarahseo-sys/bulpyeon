<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배달앱 할인 한눈에 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FFF8EC;
    --ink:#2B2A33;
    --muted:#6B6877;
    --coral:#FF6B4A;
    --sun:#FFC83D;
    --teal:#19B5A5;
    --violet:#7C5CFF;
    --card:#FFFFFF;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;
    word-break:keep-all;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.9);backdrop-filter:blur(10px);
       border-bottom:1px solid rgba(43,42,51,.06)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .logo b{color:var(--coral)}
  .pill{background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}

  /* hero */
  .hero{position:relative;padding:44px 0 56px;overflow:hidden}
  .blob{position:absolute;border-radius:50%;z-index:0;filter:blur(2px)}
  .b1{width:260px;height:260px;background:var(--sun);right:-80px;top:-60px;opacity:.7}
  .b2{width:150px;height:150px;background:var(--teal);left:-50px;bottom:10px;opacity:.35}
  .b3{width:70px;height:70px;background:var(--violet);right:12%;bottom:30px;opacity:.35}
  .hero .wrap{position:relative;z-index:1}
  .eyebrow{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;
           padding:5px 14px;font-size:13px;font-weight:700;margin-bottom:18px}
  h1{font-size:clamp(32px,9vw,56px);line-height:1.2;letter-spacing:-.035em;font-weight:900}
  h1 .hl{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 2px}
  h1 .co{color:var(--coral)}
  .lead{margin-top:18px;font-size:17px;color:var(--muted);max-width:520px}

  /* 음식점 선택 */
  .picker{
    margin-top:28px;background:#fff;border-radius:var(--radius);padding:16px 18px;
    border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .picker small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--coral)}
  .picker strong{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .ex{
    flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
    background:var(--sun);color:var(--ink);
  }

  /* 앱별 결과 */
  .head{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .head h2{font-size:22px;line-height:1.3;letter-spacing:-.03em;font-weight:900}
  .later{
    font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;
    background:#fff;border:2px dashed var(--ink);color:var(--ink);
  }
  .grid{margin-top:16px;display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{
    background:var(--card);border-radius:var(--radius);padding:20px;border:2px solid var(--ink);
    display:flex;align-items:center;gap:14px;
  }
  @media(min-width:640px){.card{flex-direction:column;align-items:flex-start}}
  .no{
    flex:none;font-size:14px;font-weight:800;color:#fff;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
  }
  .card:nth-child(1) .no{background:var(--coral)}
  .card:nth-child(2) .no{background:var(--teal)}
  .card:nth-child(3) .no{background:var(--violet)}
  .card .t{flex:1;min-width:0}
  .card h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .card .deal{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.3}
  .card p{font-size:14px;color:var(--muted)}
  .card .ex{align-self:flex-start;background:#fff;border:1.5px solid var(--ink);font-size:11px;padding:2px 8px}

  /* 저장 */
  .save{margin-top:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    font:inherit;font-weight:700;font-size:16px;padding:15px 24px;border-radius:999px;border:0;
    background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(255,107,74,.35);
    opacity:.45;cursor:not-allowed;box-shadow:none;
  }
  .note{margin-top:20px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="#top" class="logo">할인비교<b>.</b></a>
    <span class="pill">배달앱</span>
  </div>
</header>

<main id="top">
  <div class="hero">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="wrap">
      <span class="eyebrow">배달앱 할인 비교</span>
      <h1>앱마다 열어볼 필요 없이,<br><span class="hl">할인은 한 화면</span>에서<span class="co">.</span></h1>
      <p class="lead">고른 음식점의 할인 정보를 배달앱별로 나눠서 보여드려요.</p>

      <div class="picker">
        <div>
          <small>음식점</small>
          <strong>예시 음식점</strong>
        </div>
        <span class="ex">예시 값</span>
      </div>

      <div class="head">
        <h2>앱별 할인 정보</h2>
        <span class="later">실시간 · 나중에 연결</span>
      </div>

      <div class="grid">
        <div class="card">
          <div class="no">A</div>
          <div class="t">
            <h3>배달앱 A</h3>
            <div class="deal">○○원 할인</div>
            <p>쿠폰·이벤트 내용 자리</p>
          </div>
          <span class="ex">예시</span>
        </div>
        <div class="card">
          <div class="no">B</div>
          <div class="t">
            <h3>배달앱 B</h3>
            <div class="deal">○○원 할인</div>
            <p>쿠폰·이벤트 내용 자리</p>
          </div>
          <span class="ex">예시</span>
        </div>
        <div class="card">
          <div class="no">C</div>
          <div class="t">
            <h3>배달앱 C</h3>
            <div class="deal">○○원 할인</div>
            <p>쿠폰·이벤트 내용 자리</p>
          </div>
          <span class="ex">예시</span>
        </div>
      </div>

      <div class="save">
        <button class="btn" type="button" disabled aria-disabled="true">이 음식점 저장하기</button>
        <span class="later">저장 · 나중에 연결</span>
      </div>
      <p class="note">지금 보이는 음식점, 앱 이름, 할인 내용은 모두 화면 구성을 보여주기 위한 예시예요.</p>
    </div>
  </div>
</main>

</body>
</html>
