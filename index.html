<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요리명만 적으면 재료가 한눈에</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FFF8EC;
    --ink:#2B2A33;
    --muted:#6B6877;
    --coral:#FF6B4A;
    --sun:#FFC83D;
    --teal:#19B5A5;
    --violet:#7C5CFF;
    --card:#FFFFFF;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;
    word-break:keep-all;overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.9);backdrop-filter:blur(10px);
       border-bottom:1px solid rgba(43,42,51,.06)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .logo b{color:var(--coral)}
  .pill{background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600}

  /* hero */
  .hero{position:relative;padding:44px 0 56px;overflow:hidden}
  .blob{position:absolute;border-radius:50%;z-index:0;filter:blur(2px)}
  .b1{width:260px;height:260px;background:var(--sun);right:-80px;top:-60px;opacity:.7}
  .b2{width:150px;height:150px;background:var(--teal);left:-50px;bottom:10px;opacity:.35}
  .b3{width:70px;height:70px;background:var(--violet);right:12%;bottom:30px;opacity:.35}
  .hero .wrap{position:relative;z-index:1}
  .eyebrow{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;
           padding:5px 14px;font-size:13px;font-weight:700;margin-bottom:18px}
  h1{font-size:clamp(32px,9vw,56px);line-height:1.2;letter-spacing:-.035em;font-weight:900}
  h1 .hl{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 2px}
  h1 .co{color:var(--coral)}
  .lead{margin-top:18px;font-size:17px;color:var(--muted);max-width:520px}

  /* 검색 */
  .search{
    margin-top:28px;background:#fff;border-radius:var(--radius);padding:16px 18px;
    border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  }
  .search label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--coral);margin-bottom:6px}
  .search input{
    width:100%;font:inherit;font-size:19px;font-weight:800;letter-spacing:-.02em;
    border:0;outline:0;background:transparent;color:var(--ink);padding:2px 0 8px;
    border-bottom:2px solid rgba(43,42,51,.12);
  }
  .search input::placeholder{color:#A8A5B2}
  .search input:focus{border-bottom-color:var(--coral)}
  .row{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    font:inherit;font-weight:700;font-size:16px;padding:14px 24px;border-radius:999px;border:0;
    background:var(--coral);color:#fff;
    opacity:.45;cursor:not-allowed;
  }
  .btn.alt{background:var(--ink)}
  .later{
    font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;
    background:#fff;border:2px dashed var(--ink);color:var(--ink);
  }
  .ex{
    flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
    background:var(--sun);color:var(--ink);
  }

  /* 결과 */
  .head{margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .head h2{font-size:22px;line-height:1.3;letter-spacing:-.03em;font-weight:900}
  .result{
    margin-top:16px;background:var(--card);border-radius:var(--radius);padding:8px 20px;
    border:2px solid var(--ink);
  }
  .item{
    display:flex;align-items:center;gap:14px;padding:14px 0;
    border-bottom:1px solid rgba(43,42,51,.1);
  }
  .item:last-child{border-bottom:0}
  .no{
    flex:none;font-size:13px;font-weight:800;color:#fff;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;
  }
  .item:nth-child(1) .no{background:var(--coral)}
  .item:nth-child(2) .no{background:var(--teal)}
  .item:nth-child(3) .no{background:var(--violet)}
  .item:nth-child(4) .no{background:#F29A00}
  .item .t{flex:1;min-width:0}
  .item h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .item p{font-size:13.5px;color:var(--muted)}

  .save{margin-top:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .note{margin-top:20px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a href="#top" class="logo">재료확인<b>.</b></a>
    <span class="pill">요리</span>
  </div>
</header>

<main id="top">
  <div class="hero">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
    <div class="wrap">
      <span class="eyebrow">요리하는 사람을 위한 재료 확인</span>
      <h1>요리명만 적으면,<br><span class="hl">필요한 재료</span>를 알려드려요<span class="co">.</span></h1>
      <p class="lead">레시피를 찾아다니며 재료를 확인하지 않아도 돼요.</p>

      <div class="search">
        <label for="dish">요리명</label>
        <input id="dish" type="text" placeholder="예시 요리명" autocomplete="off">
        <div class="row">
          <button class="btn" type="button" disabled aria-disabled="true">재료 알아보기</button>
          <span class="later">검색 · 나중에 연결</span>
        </div>
      </div>

      <div class="head">
        <h2>필요한 재료</h2>
        <span class="ex">예시</span>
      </div>

      <div class="result">
        <div class="item">
          <div class="no">1</div>
          <div class="t"><h3>재료 이름</h3><p>분량 자리</p></div>
        </div>
        <div class="item">
          <div class="no">2</div>
          <div class="t"><h3>재료 이름</h3><p>분량 자리</p></div>
        </div>
        <div class="item">
          <div class="no">3</div>
          <div class="t"><h3>재료 이름</h3><p>분량 자리</p></div>
        </div>
        <div class="item">
          <div class="no">4</div>
          <div class="t"><h3>재료 이름</h3><p>분량 자리</p></div>
        </div>
      </div>

      <div class="save">
        <button class="btn alt" type="button" disabled aria-disabled="true">이 재료 목록 저장하기</button>
        <span class="later">저장 · 나중에 연결</span>
      </div>
      <p class="note">지금 보이는 재료와 분량은 화면 구성을 보여주기 위한 예시예요. 요리명을 적어도 아직 결과는 바뀌지 않아요.</p>
    </div>
  </div>
</main>

</body>
</html>
